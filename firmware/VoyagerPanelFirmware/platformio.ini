; PlatformIO Project Configuration File
; Voyager Panel - ESP32-S3-MINI-1 + Waveshare 2.9" V2 (GDEM029T94 / SSD1680)
 
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
 
monitor_speed = 115200
 
lib_deps =
    zinggjm/GxEPD2 @ ^1.5.2
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/Adafruit BMP280 Library @ ^2.6.8
 
; Tu PCB no tiene chip USB-UART: el USB-C va directo a D+/D- del ESP32-S3.
; Estos dos flags mandan Serial al USB CDC nativo en vez de al UART0 muerto.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
 
; SOLO descomenta estas dos si al abrir el monitor la placa se reinicia sola
; o se queda colgada muda (el S3 imita el auto-reset via DTR/RTS por software).
; monitor_dtr = 0
; monitor_rts = 0
 